name: Release

# Build an installable WordPress plugin zip and attach it to a GitHub Release
# whenever a version tag (v*) is pushed. The plugin-update-checker in the plugin
# reads this release asset, so CI is the sole release builder.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the Release and upload the asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fail fast if the pushed tag (v0.9.0) disagrees with package.json (0.9.0).
      # Catches a forgotten version bump or a mistyped tag before anything ships.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump the version files or retag."
            exit 1
          fi

      # Runs the webpack build, wp-scripts plugin-zip, then rename-zip.js,
      # emitting bws-block-visibility-acf-datetime-extension-<version>.zip in the repo root.
      - name: Build installable package
        run: npm run package

      - name: Create release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          files: bws-block-visibility-acf-datetime-extension-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
